name: Actualizar datos

on:
  schedule:
    # Lunes a viernes, 22:30 UTC (tras el cierre de Nueva York; Madrid ya ha cerrado)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_data.py
      - name: Buscador Wyckoff (scan)
        if: always()
        run: python scripts/scan.py
      - name: Guardar datos en el repositorio
        if: always()   # si algún valor falla, se guardan los demás
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Datos $(date -u +%Y-%m-%d)"
          git push
